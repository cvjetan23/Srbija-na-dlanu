name: WordPress checks and package
on:
  push:
    branches: [main, feature/v3-8-buttons]
  workflow_dispatch:
concurrency:
  group: wp-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: snd-ci-only
          MYSQL_DATABASE: snd_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psnd-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and frontend regressions
        run: |
          find srbija-na-dlanu tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check srbija-na-dlanu/assets/game.js
          node tests/frontend.js
          node tests/v3-frontend.js
          node tests/transport.js
          if test -f tests/qa-frontend.js; then node tests/qa-frontend.js; fi
      - name: Isolated WordPress
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          mkdir -p /tmp/snd-wp
          php /tmp/wp-cli.phar --path=/tmp/snd-wp core download
          php /tmp/wp-cli.phar --path=/tmp/snd-wp config create --dbname=snd_test --dbuser=root --dbpass=snd-ci-only --dbhost=127.0.0.1
          php /tmp/wp-cli.phar --path=/tmp/snd-wp config set WP_ENVIRONMENT_TYPE local
          php /tmp/wp-cli.phar --path=/tmp/snd-wp core install --url=http://snd.test --title='SND isolated tests' --admin_user=snd-ci --admin_password='ephemeral-ci-test-only-password' --admin_email=ci@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE/srbija-na-dlanu" /tmp/snd-wp/wp-content/plugins/srbija-na-dlanu
          php /tmp/wp-cli.phar --path=/tmp/snd-wp plugin activate srbija-na-dlanu
      - name: Optimizer and SEO integration fixtures
        run: |
          php /tmp/wp-cli.phar --path=/tmp/snd-wp plugin install autoptimize slim-seo --activate
      - name: WordPress regressions
        env:
          WP_ROOT: /tmp/snd-wp
        run: |
          php tests/game-flow.php
          php tests/account-progress.php
          php tests/asset-loading.php
          if test -f tests/qa-regressions.php; then php tests/qa-regressions.php; fi
          php tests/v3-features.php
          php tests/atlas-flow.php
          php tests/transport.php
          php tests/presentation.php
          php tests/belgrade.php
          php tests/ranking.php
          php tests/palette.php
      - name: Real Chromium map and preference flows
        env:
          WP_ROOT: /tmp/snd-wp
          SND_TEST_URL: http://127.0.0.1:8899
          SND_PLAYWRIGHT_PATH: /tmp/snd-browser/node_modules/playwright-core
          SND_SCREENSHOTS: /tmp/snd-screenshots
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          php /tmp/wp-cli.phar --path=/tmp/snd-wp config set WP_HOME 'getenv("SND_TEST_URL") ?: "http://snd.test"' --raw
          php /tmp/wp-cli.phar --path=/tmp/snd-wp config set WP_SITEURL WP_HOME --raw
          php /tmp/wp-cli.phar --path=/tmp/snd-wp rewrite structure '/%postname%/'
          npm install --prefix /tmp/snd-browser playwright-core@1.65.0 --no-audit --no-fund
          php -S 127.0.0.1:8899 -t /tmp/snd-wp tests/http-router.php >/tmp/snd-http.log 2>&1 &
          snd_server_pid=$!
          trap 'kill "$snd_server_pid"' EXIT
          node tests/atlas-browser.cjs
          node tests/polish-browser.cjs
          node tests/presentation-browser.cjs
          node tests/update34-browser.cjs
          node tests/ranking-browser.cjs
          node tests/sunrise-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-chromium-previews
          path: /tmp/snd-screenshots
          if-no-files-found: ignore
      - name: Build and inspect installable ZIP
        run: python3 tools/build-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: srbija-na-dlanu-package
          path: |
            dist/srbija-na-dlanu.zip
            dist/SHA256SUMS
  package:
    if: github.ref == 'refs/heads/feature/v3-8-buttons'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Commit reproducible package to the tested branch
        run: |
          python3 tools/build-package.py
          git add dist/srbija-na-dlanu.zip dist/SHA256SUMS
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build verified WordPress installation package"
            git push origin HEAD:feature/v3-8-buttons
          fi
